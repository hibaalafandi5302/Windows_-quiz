<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اختبار أساسيات الحاسب - الجزء 2</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mut:#667085;--pri:#2f5bd6;--ok:#1a8a4a;--okb:#e1f5e9;--no:#c62f2f;--nob:#fde8e8;--bd:#d7dce8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12151c;--card:#1b202b;--tx:#e8ecf4;--mut:#9aa4b8;--pri:#6b8cff;--ok:#4cd187;--okb:#16352a;--no:#ff7b7b;--nob:#3a1d1d;--bd:#313a4d}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.7}
main{max-width:680px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px}
h1{font-size:1.4rem;margin:0 0 8px}
.tm{font-weight:700;font-variant-numeric:tabular-nums}.tm.low{color:var(--no)}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin:10px 0 16px}
.bar i{display:block;height:100%;background:var(--pri);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem}
.q{font-size:1.15rem;font-weight:700;margin:6px 0 14px}
.opt{display:block;width:100%;text-align:right;font:inherit;color:inherit;background:transparent;border:2px solid var(--bd);border-radius:12px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--pri)}
.opt.ok{border-color:var(--ok);background:var(--okb)}
.opt.no{border-color:var(--no);background:var(--nob)}
.btn{font:inherit;font-weight:700;background:var(--pri);color:#fff;border:0;border-radius:12px;padding:12px 22px;cursor:pointer;margin-top:12px}
.btn[hidden]{display:none}
.score{font-size:3rem;font-weight:800;text-align:center;margin:8px 0}
.res{text-align:center;font-size:1.1rem}
.rev{border-top:1px solid var(--bd);padding:10px 0;font-size:.95rem}
.rev b{color:var(--no)}.rev span{color:var(--ok)}
</style>
</head>
<body>
<main><div class="card" id="app"></div></main>
<script>
const D=[
["ما الصحيح فيما يتعلق بكلمة السر؟",["يجب تغييرها بانتظام","لا يجب أن تحتوي على رموز وحروف خاصة","يجب أن تكون معروفة من قبل المسؤول عن النظام","يجب تغييرها فقط إذا تم المساس بها أو تم تخمينها"],0],
["لماذا يستخدم جدار الحماية؟",["تحديد صلاحيات الدخول","الحفاظ على الشبكة آمنة","وقف انتشار الفيروسات","جعل الأشخاص يعملون بجهد أكبر"],1],
["ما الذي يقوم بتصفية وفلترة كل محاولات الدخول إلى الشبكة؟",["الرقابة الأبوية","المقاييس الحيوية","الجدار الناري","مضاد الفيروسات"],2],
["أي مما يلي يراقب الحركة القادمة على الشبكة لحمايتها من الهجوم الخارجي؟",["درع البيانات","الحارس الناري","درع الشبكة","الجدار الناري"],3],
["ما الذي ينبغي القيام به لضمان توفر البيانات وعدم ضياعها أو تلفها؟",["تنصيب الجدار الناري","تنظيم الملفات في المجلدات","تشفير البيانات","القيام بالنسخ الاحتياطي"],3],
["أي مما يلي يوضح أهمية استخدام الجدران النارية؟",["لمنع تدمير الحاسوب في حالة حدوث حريق","لكشف وإبطال الفيروسات الموجودة على الحاسب","لتمكين تحميل البيانات بسهولة من المواقع على شبكة الانترنت","لمنع الدخول غير المصرح به من قبل الاتصالات الواردة على الشبكة"],3],
["ما هو السبب الهام الذي يتوجب من أجله إنشاء نسخ احتياطية من البيانات بشكل دوري؟",["امتثالا لقانون البيانات","لمنع فقدان البيانات","لحماية الحاسوب","لزيادة مساحة القرص الصلب الفارغة"],1],
["ما هو الخيار المناسب للوقاية من الفيروسات؟",["تعليم الرسالة الالكترونية كغير مقروءة","تعليم الرسالة الالكترونية كمقروءة","تأجيل قراءة الرسالة الالكترونية لأسبوع","عدم فتح رسالة الكترونية مجهولة المصدر"],3],
["أي من الأماكن التالية هو الأفضل لحفظ النسخ الاحتياطية من البيانات بشكل آمن؟",["في موقع محصن ضد الحريق","بجانب الحاسوب","في موقع بعيد عن الحاسوب","في القرص المحلي C"],2],
["أي مما يلي يوضح الحاجة الضرورية لتحديث برامج مكافحة الفيروسات بانتظام؟",["لحماية الحاسب من الرسائل غير المرغوب بها","لمنع انتشار البرامج الضارة على الانترنت","للتأكد من أن البرنامج يتعرف على الفيروسات القديمة","لحماية الحاسب من جميع الفيروسات المعروفة"],3],
["أي الطرق التالية تعد أفضل لمنع فقدان البيانات في حال حدوث انقطاع التيار الكهربائي؟",["استخدام مقابس فلترة للكهرباء","استخدام برنامج مكافحة الفيروسات","التأكد من استخدام اسم مستخدم وكلمة مرور","عمل نسخ احتياطية بشكل دوري للبيانات"],3],
["ماذا ندعو البرامج الخبيثة التي لا تحتاج إلى إلصاق نفسها ببرنامج آخر ولا إلى تدخل من قبل المستخدم لكي تنتشر؟",["الفيروسات","الديدان","احصنة طروادة","برامج التجسس"],1],
["ماذا ندعو البرامج التي تبدو مفيدة، ولكن عندما يتم تشغيلها يتم تثبيت اوامر وبرمجيات خبيثة على الحاسب دون علم المستخدم؟",["الفيروسات","الديدان","احصنة طروادة","برامج التجسس"],2],
["أي مما يأتي أحد أنواع البرامج الضارة التي تنسخ نفسها وتنتشر من حاسوب لآخر من خلال إصابة الملفات الأخرى؟",["الجدار الناري","البرامج التطبيقية","نظام التشغيل","الفيروسات"],3],
["أي مما يأتي يعمل على منع اصابة حاسوبك بالبرامج الضارة؟",["تحديث برامج مكافحة الفيروسات","إنشاء نسخ احتياطية للفيروسات","تثبيت البرامج التي تمنع القرصنة","تثبيت كلمة مرور أمان على الجهاز"],0],
["أي مما يلي يحمي استخدامه جهاز الحاسب من خطر البرامج الضّارة؟",["برمجيات تشخيص واصلاح الحاسب","برمجيات مكافحة البريد المزعج","برمجيات مكافحة التجسس","برمجيات تتبع مواقع الويب"],2],
["أي من الخيارات التالية يمكن أن يؤدي إلى انتشار البرامج الضارة؟",["فتح المرفقات التي تم فتحها من الفيروسات","تحديث البرامج المضادة للفيروسات بانتظام","استخدام البرامج التي تم فحصها من الفيروسات فقط","استخدام ذاكرة الفلاش لتبادل البيانات من مصادر غير معروفة"],3],
["أي مما يأتي يسمح للفيروس بالدخول إلى الحاسب أو الأجهزة؟",["استخدام البرمجيات التجارية التي تم فحصها من الفيروسات","فتح الملفات المرسلة من مجهولين","استخدام شاشة التوقف","استخدام حاسوب آمن لإرسال البريد الالكتروني"],1],
["أي الأنشطة التالية يؤدي إلى إصابة الحاسوب أو الاجهزة بالبرامج الماكرة؟",["تنزيل الملفات من مصدر مجهول","تغيير شاشة العرض","فرز الملفات والمجلدات","نسخ البيانات نسخا احتياطيا بعيدا عن موقعها"],0],
["أي مما يلي يمكن أن يكون وصفا لفيروس الحاسب؟",["برنامج يمكنه تدمير الحاسب","خطأ في المعدات","برنامج يتم تنزيله من الانترنت","منطقة تالفة في القرص الصلب"],0],
["ماذا ندعو البرامج التي تتم كتابتها بواسطة مبرمجين محترفين بغرض إلحاق الضرر بحاسب آخر؟",["البرامج التنفيذية","وحدات الماكرو","الفيروسات","التشفير"],2],
["أي مما يلي يعمل على توفير الطاقة الكهربائية عند استعمال الحاسوب؟",["زيادة سعة الذاكرة الافتراضية","زيادة سعة القرص الصلب","تعيين خلفية مناسبة لسطح المكتب","إنقاص ضوء الخلفية بعد فترة من التوقف عن العمل"],3],
["أي مما يأتي يعد ممارسة جيدة في توفير الطاقة؟",["تحديث شاشة التوقف بشكل دوري","تغيير صورة خلفية الشاشة","تحديث شاشة العرض بشكل دوري","ضبط إعدادات الشاشة للإطفاء بشكل تلقائي عند التوقف عن العمل على الحاسوب"],3],
["يمكن المساعدة في حماية البيئة عن طريق؟",["استخدام حافظ الشاشة","التقليل من الطباعة على الورق","استخدام سماعات الرأس","استخدام شاشات صغيرة"],1],
["أي مما يلي يعد ممارسة جيدة لأسباب بيئية؟",["تثبيت برامج مكافحة للفيروسات","إعادة تدوير الورق المستخدم","التخلص من عبوات الحبر","تفقد البريد الوارد"],1],
["ما الذي ينبغي فعله بعبوات حبر الطابعة الفارغة؟",["ارسالها للشركة المصنعة","التخلص منها عن طريق تكسيرها","إلقاؤها في سلة المهملات","إعطاؤها للأطفال للعب بها"],0],
["أي مما يلي ليس ممارسة صحيحة فيما يتعلق بكلمات المرور؟",["عدم مشاركة كلمات المرور مع أي شخص نهائيا","إنشاء كلمات مرور تتألف من أكثر من 8 حروف","إنشاء كلمات مرور من خليط من الحروف والارقام","عدم تغيير كلمات المرور نهائيا"],3],
["أي مما يلي هي سياسة كلمة مرور جيدة لمنظمة؟",["تغيير كلمات المرور بشكل دوري","استخدام كلمات المرور التي تتألف من 4 حروف","مشاركة كلمات المرور","استخدام الاسم الشخصي ككلمة مرور"],0],
["أي كلمات المرور الآتية هي الأنسب؟",["123456","PASSWORD","password","p$$WoRd788"],3],
["أي مما يلي لا يعتبر من الأمور الهامة عند اشتراك في خدمة الانترنت؟",["سرعة التحميل","سرعة التنزيل","سعة التنزيل","سرعة المعالج"],3],
["أي مما يلي يعمل على تحسين اداء الحاسوب؟",["تكبير حجم شاشة العرض","تصغير حجم ذاكرة الوصول العشوائي RAM","تصغير حجم شاشة العرض","تكبير حجم ذاكرة الوصول العشوائي RAM"],3],
["أي مما يلي يمثل الهدف الرئيسي لذاكرة الوصول العشوائي RAM؟",["للسماح للمستخدمين بإدخال المعلومات للحاسب","لتوفير وسيط تخزين قابل للإزالة للبيانات الدائمة","للتعامل مع البيانات وتنفيذ التعليمات","لتوفير مساحة تخزين مؤقتة للبيانات والتعليمات"],3],
["أي مما يلي يقلل من إجهاد العين؟",["الجلوس قريبا من الشاشة","تعيين شاشة توقف","أخذ فترات استراحة بشكل منتظم","تدوير الورق التالف"],2],
["أي مما يلي هو نوع من أنواع منافذ الادخال والاخراج؟",["الناقل المتسلسل الشامل USB","الطابعة","الفأرة","ذاكرة الوصول العشوائي RAM"],0],
["أي الأنواع البرامج التالية يعمل على ادارة ذاكرة الحاسوب؟",["برنامج متصفح الانترنت","برنامج نظام التشغيل","البرامج التطبيقية","برامج مكافحة الفيروسات"],1]
];
const app=document.getElementById('app');
let Q,i,sc,wrong,T,tid;
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function tick(){T--;const e=document.getElementById('t');if(e){e.textContent=fmt(Math.max(T,0));if(T<=60)e.classList.add('low')}if(T<=0)end(true)}
const sh=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[a[k],a[j]]=[a[j],a[k]]}return a};
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function start(){
  app.innerHTML=`<h1>اختبار أساسيات الحاسب - الجزء 2</h1><p>${D.length} سؤالاً من أسئلة القسم النظري. اختر الإجابة الصحيحة وستظهر النتيجة في النهاية.</p><p>⏱️ مدة الاختبار: ${fmt(D.length*45)} دقيقة (45 ثانية لكل سؤال تقريباً)، وعند انتهاء الوقت يُغلق الاختبار تلقائياً.</p><button class="btn" id="go">ابدأ الاختبار</button>`;
  document.getElementById('go').onclick=()=>{Q=sh(D.map(([q,o,a])=>({q,o:sh(o.map((t,n)=>({t,c:n==a}))) })));i=0;sc=0;wrong=[];T=D.length*45;clearInterval(tid);show();tid=setInterval(tick,1000)};
}
function show(){
  const x=Q[i];
  app.innerHTML=`<div class="meta"><span>السؤال ${i+1} من ${Q.length}</span><span>النتيجة: ${sc}</span><span class="tm${T<=60?' low':''}" id="t">⏱️ ${fmt(T)}</span></div><div class="bar"><i style="width:${i/Q.length*100}%"></i></div><div class="q">${esc(x.q)}</div><div id="o"></div><button class="btn" id="nx" hidden>${i+1<Q.length?'التالي':'عرض النتيجة'}</button>`;
  const o=document.getElementById('o'),nx=document.getElementById('nx');
  x.o.forEach(op=>{const b=document.createElement('button');b.className='opt';b.textContent=op.t;
    b.onclick=()=>{[...o.children].forEach((e,n)=>{e.disabled=true;if(x.o[n].c)e.classList.add('ok')});
      if(op.c)sc++;else{b.classList.add('no');wrong.push([x.q,op.t,x.o.find(z=>z.c).t])}
      nx.hidden=false;nx.focus()};
    o.appendChild(b)});
  nx.onclick=()=>{i++;i<Q.length?show():end()};
}
function end(to){clearInterval(tid);
  const p=Math.round(sc/Q.length*100);
  const msg=p>=90?'ممتاز! 🌟':p>=70?'جيد جداً 👍':p>=50?'مقبول، تحتاج لمراجعة بسيطة':'تحتاج إلى مزيد من المراجعة';
  app.innerHTML=`<h1>نتيجة الاختبار</h1><div class="score">${sc} / ${Q.length}</div><div class="res">${p}% — ${msg}</div>${to?`<p class="res">⏰ انتهى الوقت، واحتُسبت ${Q.length-sc-wrong.length} أسئلة غير مجابة كأخطاء.</p>`:''}`+
  (wrong.length?`<h3>الأسئلة التي أخطأت فيها</h3>`+wrong.map(w=>`<div class="rev">${esc(w[0])}<br><b>إجابتك: ${esc(w[1])}</b><br><span>الصحيح: ${esc(w[2])}</span></div>`).join(''):'<p class="res">إجاباتك كلها صحيحة!</p>')+
  `<button class="btn" id="re">إعادة الاختبار</button>`;
  document.getElementById('re').onclick=start;
}
start();
</script>
</body>
</html>
