<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اختبار أساسيات الحاسب - الجزء 1</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mut:#667085;--pri:#2f5bd6;--ok:#1a8a4a;--okb:#e1f5e9;--no:#c62f2f;--nob:#fde8e8;--bd:#d7dce8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12151c;--card:#1b202b;--tx:#e8ecf4;--mut:#9aa4b8;--pri:#6b8cff;--ok:#4cd187;--okb:#16352a;--no:#ff7b7b;--nob:#3a1d1d;--bd:#313a4d}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.7}
main{max-width:680px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px}
h1{font-size:1.4rem;margin:0 0 8px}
.tm{font-weight:700;font-variant-numeric:tabular-nums}.tm.low{color:var(--no)}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin:10px 0 16px}
.bar i{display:block;height:100%;background:var(--pri);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem}
.q{font-size:1.15rem;font-weight:700;margin:6px 0 14px}
.opt{display:block;width:100%;text-align:right;font:inherit;color:inherit;background:transparent;border:2px solid var(--bd);border-radius:12px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--pri)}
.opt.ok{border-color:var(--ok);background:var(--okb)}
.opt.no{border-color:var(--no);background:var(--nob)}
.inp{font:inherit;width:100%;padding:12px;border:2px solid var(--bd);border-radius:12px;background:transparent;color:inherit;margin-top:8px}
.btn{font:inherit;font-weight:700;background:var(--pri);color:#fff;border:0;border-radius:12px;padding:12px 22px;cursor:pointer;margin-top:12px}
.btn[hidden]{display:none}
.score{font-size:3rem;font-weight:800;text-align:center;margin:8px 0}
.res{text-align:center;font-size:1.1rem}
.rev{border-top:1px solid var(--bd);padding:10px 0;font-size:.95rem}
.rev b{color:var(--no)}.rev span{color:var(--ok)}
</style>
</head>
<body>
<main><div class="card" id="app"></div></main>
<script>
const D=[
["إلى ماذا يرمز المصطلح ICT؟",["تكنولوجيا المعلومات والاتصالات","تكنولوجيا الإنترنت والحاسوب","تكنولوجيا المعلومات والحاسوب","الإنترنت والتحكم بالنقل"],0],
["أي مما يلي لا يعمل على تحسين أداء الحاسوب؟",["سرعة المعالج","حجم ذاكرة الوصول العشوائي","حجم ذاكرة القراءة فقط","حجم القرص الصلب"],2],
["أي مما يلي يعد حاسوبا؟",["رخصة برنامج","مكبر الصوت","نظام التشغيل","الحاسب المحمول"],3],
["أي أجزاء الحاسوب الآتية مسؤول عن التحكم بتنفيذ التعليمات بشكل كامل؟",["وحدة تزيد الطاقة","محرك القرص الرقمي","محرك القرص الصلب","المعالج"],3],
["أي مما يلي يشير إلى مصطلح USB؟",["المصرف المتسلسل الشامل","الكتلة المتسلسلة الشاملة","الناقل المتسلسل الشامل","الفراغ المتسلسل الشامل"],2],
["المنفذ الذي ينقل الصوت والصورة في كبل واحد ويوصل التلفاز ونظام الألعاب بالحاسوب؟",["المنفذ المتوازي","المنفذ الناقل التسلسلي الشامل USB","منفذ الفيديو","المنفذ متعدد الوسائط عالي الوضوح HDMI"],3],
["أي مما يلي يعتبر منفذ إدخال وإخراج معا؟",["الفأرة","الشاشة","المنفذ متعدد الوسائط عالي الوضوح HDMI","الماسح الضوئي"],2],
["أي أنواع البرمجيات تقوم بإدارة مصادر الحاسوب، كالذاكرة مثلاً؟",["برامج نظام التشغيل","برامج قواعد البيانات","برامج معالجة النصوص","برامج الجداول الإلكترونية"],0],
["أي مما يأتي هو مثال على برنامج نظام التشغيل؟",["إكسل","أدوبي ريدر","أكسس","أندرويد"],3],
["أي مما يلي يعتبر ضروريا لعمل الحاسب؟",["معالج النصوص","النشر المكتبي","قواعد البيانات","نظام التشغيل"],3],
["ماذا ندعو مجموعة التعليمات والتوجيهات التي يحتاجها الحاسوب لأداء مهامه؟",["البرمجيات","المعدات","جدار الحماية","المنسقات الضوئية"],0],
["أي مما يأتي هو مثال على برنامج نظام التشغيل؟",["معالج النصوص","النشر المكتبي","إدارة المشاريع","لينوكس"],3],
["أي من أنظمة التشغيل التالية لا يستخدم واجهة رسومية GUI؟",["Windows","Unix","Dos","Linux"],2],
["أي مما يأتي هو برنامج يمكن تنزيله واستخدامه مع بعض القيود، وعادة ما يتطلب الشراء والتسجيل لاستخدامه بشكل فوري؟",["البرنامج التجريبي","البرنامج التطبيقي","البرنامج المجاني","البرنامج مفتوح المصدر"],0],
["أي مما يلي هو أحد البرامج التطبيقية؟",["الطابعة","القرص الصلب","ذاكرة الوصول العشوائي","متصفح الإنترنت"],3],
["أي من أنواع رخص البرمجيات التالية يحتاجها المستخدم للاستخدام الشخصي لبرنامج معين؟",["رخصة برنامج مجاني","رخصة مستخدم بنطاق عام","رخصة برنامج فردية","رخصة برنامج تجريبي"],2],
["إلى ماذا يشير المصطلح EULA؟",["مرفق ترخيص المستخدم النهائي","اتفاقية ترخيص المستخدم النهائي","السماح بترخيص المستخدم النهائي","حساب ترخيص المستخدم النهائي"],1],
["أي مما يلي هو طريقة لمشاركة الأفكار والنشاطات والاهتمامات عبر الإنترنت؟",["طباعة رسالة","تخزين السجلات","إنشاء المستندات","الشبكة الاجتماعية"],3],
["أي من البرامج التالية يتم استخدامه دون دفع أي رسوم؟",["البرنامج التجريبي","البرنامج التطبيقي","البرنامج المجاني","البرنامج مفتوح المصدر"],2],
["أي مما يأتي يعد مجلدا فرعيا؟",["مجلد على محرك الأقراص","مجلد ضمن ملف","مجلد ضمن مجلد آخر","مجلد"],2],
["ماذا ندعو النظام المكون من حاسوبين أو أكثر المترابطة معاً بواسطة خطوط اتصال لها قدرة على نقل البيانات؟",["جدار ناري","الخادم","الشبكة","نظام التشغيل"],2],
["أي مما يأتي هو شبكة عالمية من شبكات الحاسوب؟",["نقل البيانات","الإنترانت","الإنترنت","الإكسترانت"],2],
["ماذا يطلق على عملية استقبال البيانات مثل الصور والملفات من حاسوب بعيد عبر الإنترنت؟",["تكبير الحجم","التحميل","الإلغاء","التنزيل"],3],
["أي مما يلي هو من مميزات شبكة الحاسب؟",["زيادة سرعة إنجاز العمليات","المشاركة في مستندات الشركة","التقليل من خمول النظام","سرعة الدخول إلى النظام"],1],
["ماذا نسمي خدمة كتابة الرسائل وإرسالها واستقبالها باستخدام نظام الاتصال الإلكتروني؟",["المراسلة الفورية","موجز الويب","البريد الإلكتروني","بروتوكول نقل الصوت عبر الإنترنت"],2],
["أي مما يلي هو من مزايا بروتوكول نقل الصوت عبر الإنترنت؟",["لا يحتاج إلى معدات","تناسب الأشخاص ذوي الاحتياجات الخاصة","سهولة المراسلة الفورية","انخفاض كلفة الاتصال"],3],
["أي مما يلي هو أفضل وصف للتخزين عبر الإنترنت؟",["التكنولوجيا التي لا تسمح بتخزين بياناتك على قرص صلب داخلي","التكنولوجيا التي تسمح لك بتخزين بياناتك على الإنترنت","التكنولوجيا التي لا تسمح بتخزين بياناتك على قرص بلو راي","التكنولوجيا التي تسمح لك بتخزين بياناتك على محرك فلاش USB"],1],
["أي العبارات صحيحة؟",["الكيلو بايت أكبر من الميغابايت","التيرابايت أقل من الميغابايت","الكيلو بايت أكبر من التيرابايت","الميغابايت أقل من الغيغابايت"],3],
["ماذا نطلق على مقدار ما يتم إرساله أو استقباله عبر الشبكات من بيانات في الثانية الواحدة؟",["بروتوكول نقل الملفات","سرعة المعالج","معدل نقل البيانات","مشاركة الملفات"],2],
["ما هو السبب الذي يجعل المستخدمين يقومون بتسجيل الدخول باستخدام اسم مستخدم وكلمة مرور؟",["لمعرفة الأشخاص المتواجدين في المبنى","لإلقاء التحية الشخصية لكل مستخدم","لحماية الحاسب من الاستخدام غير المصرح به","للتأكد من حفظ وقت الدخول للمستخدمين"],2],
["يقاس معدل نقل البيانات بواحدة؟",["تيرابايت","دورة في الثانية","غيغاهرتز","بت في الثانية bit per second"],3],
["أي مما يلي ليس خياراً من خيارات الاتصال بالإنترنت؟",["السلك (الكابل)","القمر الصناعي","المعالج","الواي ماكس"],2],
["أي الاتصالات التالية بالإنترنت يعد الأبطأ نسبياً؟",["الاتصال العريض","WI-FI","الاتصال الهاتفي","WI-MAX"],2],
["ما هي طريقة تعريف المستخدمين عند تسجيل الدخول إلى الحاسب لحماية المعلومات الخاصة والحفاظ على أمن البيانات؟",["تنصيب جدار ناري","استخدام التوقيع الرقمي","تشفير البيانات بكلمة سر","اسم مستخدم وكلمة مرور"],3],
["أي مما يأتي أفضل وصف في بيان سبب إنشاء النسخ الاحتياطي للبيانات؟",["لتوفير مساحة أكبر لتخزين الملفات على القرص الصلب","لتمكين الوصول إلى البيانات من أي جزء في العالم","لتخزين الملفات بأكثر الطرق فاعلية من حيث التكلفة","لتجنب فقدان الملفات في حال تلف النسخة الأصلية"],3]
];
const app=document.getElementById('app');
let Q,i,sc,wrong,T,tid,NAME,sent;
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function tick(){T--;const e=document.getElementById('t');if(e){e.textContent=fmt(Math.max(T,0));if(T<=60)e.classList.add('low')}if(T<=0)end(true)}
const sh=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[a[k],a[j]]=[a[j],a[k]]}return a};
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function start(){
  app.innerHTML=`<h1>اختبار أساسيات الحاسب - الجزء 1</h1><p>${D.length} سؤالاً من أسئلة القسم النظري. اختر الإجابة الصحيحة وستظهر النتيجة في النهاية.</p><p>⏱️ مدة الاختبار: ${fmt(D.length*45)} دقيقة (45 ثانية لكل سؤال تقريباً)، وعند انتهاء الوقت يُغلق الاختبار تلقائياً.</p><input id="nm" class="inp" placeholder="اكتب اسمك الكامل" maxlength="60" autocomplete="name"><br><button class="btn" id="go">ابدأ الاختبار</button>`;
  document.getElementById('nm').value=NAME||'';document.getElementById('go').onclick=()=>{const nm=document.getElementById('nm'),v=nm.value.trim();if(v.length<2){nm.focus();nm.style.borderColor='var(--no)';return}NAME=v;sent=false;Q=sh(D.map(([q,o,a])=>({q,o:sh(o.map((t,n)=>({t,c:n==a}))) })));i=0;sc=0;wrong=[];T=D.length*45;clearInterval(tid);show();tid=setInterval(tick,1000)};
}
function show(){
  const x=Q[i];
  app.innerHTML=`<div class="meta"><span>السؤال ${i+1} من ${Q.length}</span><span>النتيجة: ${sc}</span><span class="tm${T<=60?' low':''}" id="t">⏱️ ${fmt(T)}</span></div><div class="bar"><i style="width:${i/Q.length*100}%"></i></div><div class="q">${esc(x.q)}</div><div id="o"></div><button class="btn" id="nx" hidden>${i+1<Q.length?'التالي':'عرض النتيجة'}</button>`;
  const o=document.getElementById('o'),nx=document.getElementById('nx');
  x.o.forEach(op=>{const b=document.createElement('button');b.className='opt';b.textContent=op.t;
    b.onclick=()=>{[...o.children].forEach((e,n)=>{e.disabled=true;if(x.o[n].c)e.classList.add('ok')});
      if(op.c)sc++;else{b.classList.add('no');wrong.push([x.q,op.t,x.o.find(z=>z.c).t])}
      nx.hidden=false;nx.focus()};
    o.appendChild(b)});
  nx.onclick=()=>{i++;i<Q.length?show():end()};
}
function send(p,to){
  if(sent)return;sent=true;
  const st=document.getElementById('st');
  const un=Q.length-sc-wrong.length;
  const body={access_key:'37e2d6b1-aa3d-4c9a-bed1-e03f3e10ecfa',subject:'نتيجة '+NAME+' - '+document.title,from_name:'اختبار أساسيات الحاسب',
    'الاسم':NAME,'الاختبار':document.title,'العلامة':sc+' / '+Q.length,'النسبة':p+'%','أسئلة غير مجابة':un,
    'الأخطاء':wrong.map((w,n)=>(n+1)+') '+w[0]+' | إجابته: '+w[1]+' | الصحيح: '+w[2]).join('\n')||'لا يوجد'};
  fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(body)})
   .then(r=>r.json()).then(j=>{if(j.success){st.textContent='✅ تم إرسال نتيجتك للمعلمة'}else throw 0})
   .catch(()=>{sent=false;st.innerHTML='⚠️ تعذر الإرسال. <button class="btn" id="rt">إعادة المحاولة</button><br>أو صوّر شاشة النتيجة وأرسلها للمعلمة';document.getElementById('rt').onclick=()=>send(p,to)});
}
function end(to){clearInterval(tid);
  const p=Math.round(sc/Q.length*100);
  const msg=p>=90?'ممتاز! 🌟':p>=70?'جيد جداً 👍':p>=50?'مقبول، تحتاج لمراجعة بسيطة':'تحتاج إلى مزيد من المراجعة';
  app.innerHTML=`<h1>نتيجة الاختبار</h1><div class="score">${sc} / ${Q.length}</div><div class="res">${p}% — ${msg}</div>${to?`<p class="res">⏰ انتهى الوقت، واحتُسبت ${Q.length-sc-wrong.length} أسئلة غير مجابة كأخطاء.</p>`:''}`+
  (wrong.length?`<h3>الأسئلة التي أخطأت فيها</h3>`+wrong.map(w=>`<div class="rev">${esc(w[0])}<br><b>إجابتك: ${esc(w[1])}</b><br><span>الصحيح: ${esc(w[2])}</span></div>`).join(''):'<p class="res">إجاباتك كلها صحيحة!</p>')+
  `<p class="res" id="st">⏳ جاري إرسال نتيجتك...</p><button class="btn" id="re">إعادة الاختبار</button>`;
  document.getElementById('re').onclick=start;send(p,to);
}
start();
</script>
</body>
</html>
