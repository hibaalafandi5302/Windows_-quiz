<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اختبار أساسيات الحاسب - الجزء 3</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mut:#667085;--pri:#2f5bd6;--ok:#1a8a4a;--okb:#e1f5e9;--no:#c62f2f;--nob:#fde8e8;--bd:#d7dce8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12151c;--card:#1b202b;--tx:#e8ecf4;--mut:#9aa4b8;--pri:#6b8cff;--ok:#4cd187;--okb:#16352a;--no:#ff7b7b;--nob:#3a1d1d;--bd:#313a4d}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.7}
main{max-width:680px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px}
h1{font-size:1.4rem;margin:0 0 8px}
.tm{font-weight:700;font-variant-numeric:tabular-nums}.tm.low{color:var(--no)}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin:10px 0 16px}
.bar i{display:block;height:100%;background:var(--pri);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem}
.q{font-size:1.15rem;font-weight:700;margin:6px 0 14px}
.opt{display:block;width:100%;text-align:right;font:inherit;color:inherit;background:transparent;border:2px solid var(--bd);border-radius:12px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--pri)}
.opt.ok{border-color:var(--ok);background:var(--okb)}
.opt.no{border-color:var(--no);background:var(--nob)}
.btn{font:inherit;font-weight:700;background:var(--pri);color:#fff;border:0;border-radius:12px;padding:12px 22px;cursor:pointer;margin-top:12px}
.btn[hidden]{display:none}
.score{font-size:3rem;font-weight:800;text-align:center;margin:8px 0}
.res{text-align:center;font-size:1.1rem}
.rev{border-top:1px solid var(--bd);padding:10px 0;font-size:.95rem}
.rev b{color:var(--no)}.rev span{color:var(--ok)}
</style>
</head>
<body>
<main><div class="card" id="app"></div></main>
<script>
const D=[
["أي مما يلي هو برنامج يمكن تنزيله واستخدامه مع بعض القيود وعادة ما يتطلب الشراء والتسجيل لاستخدامه بشكل قانوني؟",["البرامج المجانية","البرامج التجريبية","البرامج الثابتة","البرامج مفتوحة المصدر"],1],
["أي مما يلي يمثل الطريقة المستخدمة في تنظيم الملفات؟",["هرمي","شريطي","خطي","دائري"],0],
["أي مما يلي ليس جزءا من نظام الملفات الهرمي؟",["مجلد","شاشة التوقف","محرك اقراص","ملف"],1],
["أي المجلدات التالية هي الأكبر حجما؟",["مجلد حجمه 1 تيرابايت","مجلد حجمه 2 غيغابايت","مجلد حجمه 100 كيلو بايت","مجلد حجمه 50 ميغابايت"],0],
["أي مما يلي يعمل على تصغير حجم مجلد وأي ملفات يحتويها هذا المجلد بحيث يأخذ مساحة أقل على القرص الصلب؟",["برامج استخراج الملفات","برامج الجدولة الالكترونية","برامج مكافحة الفيروسات","برامج الضغط"],3],
["أي من أنواع الملفات التالية يمثل تنسيق ملفات الفيديو؟",["MP3","WAV","jpg","AVI"],3],
["أي مما يلي يعمل على تخزين فيديو عالي الجودة؟",["القرص الرقمي (DVD)","القرص المدمج/المضغوط (CD-ROM)","قرص بلوراي blue-ray","بطاقة الذاكرة memory card"],2],
["أي مما يلي يستخدم للمشاركة وللوصول الى البيانات والاجهزة بشكل آمن؟",["البريد الالكتروني","بروتوكول نقل الصوت عبر الانترنت","الشبكة","الناقل المتسلسل الشامل"],2],
["أي مما يأتي هو أفضل وصف لمزود خدمة الإنترنت؟",["برامج تسمح للمستخدمين بالاتصال بالبحث عن المعلومات عبر الانترنت","برامج تسمح للمستخدمين الاتصال بالإنترنت","مؤسسة تقوم ببيع برامج مكافحة الفيروسات وبرامج الأمان","مؤسسة تعمل على إيصال الناس بالإنترنت"],3],
["أي مما يعتبر أفضل وصف للشبكة الافتراضية الخاصة؟",["شبكة خاصة آمنة","نظام تشغيل الشبكة","شبكة عالمة من شبكات حواسيب مرتبطة","شبكة عامة متاحة للجميع"],0],
["أي من الخيارات التالية متوفر في الاعمال المصرفية عبر الانترنت؟",["التحدث مع مدير البنك","تحويل الأموال بين الحسابات","ايداع الاموال في الحساب","سحب مال نقدي من الحساب"],1],
["أي مما يلي هو أفضل وصف للهدف الرئيسي من الشبكات؟",["لإرسال رسائل البريد الالكتروني واستقبالها بشكل آمن","لمشاركة خطوط الهاتف والوصول اليها بشكل آمن","لمشاركة البيانات والوصول اليها بشكل آمن","لإرسال الرسائل الفورية واستقبالها بشكل آمن"],2],
["أي مما يلي يبين استخدام بروتوكول نقل الصوت عبر الانترنت VOIP؟",["لتحميل الملفات الى الانترنت","لإجراء المكالمات الهاتفية عبر الانترنت","لتنزيل الصور عبر الانترنت","لإرسال رسائل الكترونية عبر الانترنت"],1],
["أي الطرق الاتية تمكنك من الاتصال بالشبكة اللاسلكية؟",["من شريط المهام، منطقة الاعلام، ننقر على رمز الشبكة، ثم ننقر على الشبكة اللاسلكية المطلوبة","من مجلد المستخدم الشخصي، ننقر على الشبكة، ثم ننقر على الشبكة اللاسلكية المطلوبة","من قائمة ابدأ، ننقر على رمز الشبكة، ثم ننقر على الشبكة اللاسلكية المطلوبة","من مجلد المستخدم الشخصي، ننقر على رمز الشبكة، ثم ننقر على الشبكة اللاسلكية المطلوبة"],0],
["أي مما يلي هو برنامج تطبيقي يسمح بإدخال الحروف الى الحاسب؟",["مكبر الشاشة","شاشات التوقف","لوحة المفاتيح على الشاشة","قارئ الشاشة"],2],
["أي مما يلي اختصار للوصول للمزيد من معلومات عن تغير خلفية سطح المكتب؟",["ALT+F4","CTRL+V","CTRL+C","F1"],3],
["ماذا نطلق على وسيط التخزين أو وحدة التخزين الذي يمكن وضعه في شكلة مفاتيح؟",["القرص المضغوط CD","محرك اقراص فلاش USB","القرص متعدد الاستخدامات DVD","القرص المرن FLOPPY DISK"],1],
["ماذا نطلق على الشبكة التي يمكن الوصول اليها من أي شخص قريب منها؟",["شبكة بعيدة","شبكة آمنة","شبكة مغلقة","شبكة مفتوحة"],3],
["ما هي العملية التي يتم من خلالها استقبال ملفات وصور وموسيقا من حاسوب بعيد؟",["ارسال ملفات","استقبال ملفات","تحميل ملفات","تنزيل ملفات"],3],
["أي مما يأتي هو قائمة عناصر صحيحة، وتعرض على سطح المكتب؟",["التطبيقات المفتوحة، وقت، مجلدات","رموز اختصارات، مجلدات، خلفية","رموز اختصارات، وقت، زر ابدأ","رموز اختصارات، برامج مفتوحة، زر ابدأ"],1],
["أي مما يأتي يعد طريقة مناسبة لإيقاف تشغيل تطبيق لا يستجيب؟",["الضغط على المفاتيح ALT+CTRL+DELETE، نختار ادارة المهام، ثم نختار انهاء المهمة","إغلاق كافة المستندات والضغط على زر الطاقة الكهربائية حتى يتم ايقاف التشغيل","النقر على زر ابدأ، ثم النقر على زر ايقاف تشغيل الحاسوب","سحب كيبل الطاقة الكهربائية من خلف الحاسوب"],0]
];
const app=document.getElementById('app');
let Q,i,sc,wrong,T,tid;
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function tick(){T--;const e=document.getElementById('t');if(e){e.textContent=fmt(Math.max(T,0));if(T<=60)e.classList.add('low')}if(T<=0)end(true)}
const sh=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[a[k],a[j]]=[a[j],a[k]]}return a};
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function start(){
  app.innerHTML=`<h1>اختبار أساسيات الحاسب - الجزء 3</h1><p>${D.length} سؤالاً من أسئلة القسم النظري. اختر الإجابة الصحيحة وستظهر النتيجة في النهاية.</p><p>⏱️ مدة الاختبار: ${fmt(D.length*45)} دقيقة (45 ثانية لكل سؤال تقريباً)، وعند انتهاء الوقت يُغلق الاختبار تلقائياً.</p><button class="btn" id="go">ابدأ الاختبار</button>`;
  document.getElementById('go').onclick=()=>{Q=sh(D.map(([q,o,a])=>({q,o:sh(o.map((t,n)=>({t,c:n==a}))) })));i=0;sc=0;wrong=[];T=D.length*45;clearInterval(tid);show();tid=setInterval(tick,1000)};
}
function show(){
  const x=Q[i];
  app.innerHTML=`<div class="meta"><span>السؤال ${i+1} من ${Q.length}</span><span>النتيجة: ${sc}</span><span class="tm${T<=60?' low':''}" id="t">⏱️ ${fmt(T)}</span></div><div class="bar"><i style="width:${i/Q.length*100}%"></i></div><div class="q">${esc(x.q)}</div><div id="o"></div><button class="btn" id="nx" hidden>${i+1<Q.length?'التالي':'عرض النتيجة'}</button>`;
  const o=document.getElementById('o'),nx=document.getElementById('nx');
  x.o.forEach(op=>{const b=document.createElement('button');b.className='opt';b.textContent=op.t;
    b.onclick=()=>{[...o.children].forEach((e,n)=>{e.disabled=true;if(x.o[n].c)e.classList.add('ok')});
      if(op.c)sc++;else{b.classList.add('no');wrong.push([x.q,op.t,x.o.find(z=>z.c).t])}
      nx.hidden=false;nx.focus()};
    o.appendChild(b)});
  nx.onclick=()=>{i++;i<Q.length?show():end()};
}
function end(to){clearInterval(tid);
  const p=Math.round(sc/Q.length*100);
  const msg=p>=90?'ممتاز! 🌟':p>=70?'جيد جداً 👍':p>=50?'مقبول، تحتاج لمراجعة بسيطة':'تحتاج إلى مزيد من المراجعة';
  app.innerHTML=`<h1>نتيجة الاختبار</h1><div class="score">${sc} / ${Q.length}</div><div class="res">${p}% — ${msg}</div>${to?`<p class="res">⏰ انتهى الوقت، واحتُسبت ${Q.length-sc-wrong.length} أسئلة غير مجابة كأخطاء.</p>`:''}`+
  (wrong.length?`<h3>الأسئلة التي أخطأت فيها</h3>`+wrong.map(w=>`<div class="rev">${esc(w[0])}<br><b>إجابتك: ${esc(w[1])}</b><br><span>الصحيح: ${esc(w[2])}</span></div>`).join(''):'<p class="res">إجاباتك كلها صحيحة!</p>')+
  `<button class="btn" id="re">إعادة الاختبار</button>`;
  document.getElementById('re').onclick=start;
}
start();
</script>
</body>
</html>
